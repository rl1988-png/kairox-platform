[project]
name = "kairox-api"
version = "2.0.0"
description = "Kairox Platform v2 API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "sqlalchemy[asyncio]>=2.0.36",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",
    "pydantic[email]>=2.10.0",
    "pydantic-settings>=2.6.0",
    "python-jose[cryptography]>=3.3.0",
    "bcrypt>=4.2.0",
    "argon2-cffi>=23.1.0",
    "redis>=5.2.0",
    "httpx>=0.28.0",
    "python-multipart>=0.0.17",
    "structlog>=24.4.0",
    "ai-gateway",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "aiosqlite>=0.20.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kairox_api"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.per-file-ignores]
"**/routes.py" = ["B008"]
"**/routes/*.py" = ["B008"]
"**/dependencies/*.py" = ["B008"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["kairox_api"]

[[tool.mypy.overrides]]
module = ["kairox_api.models.*", "kairox_api.repositories.*"]
strict = true

[[tool.mypy.overrides]]
module = ["jose.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]

[tool.coverage.run]
source = ["src/kairox_api/features", "src/kairox_api/repositories", "src/kairox_api/services"]
omit = [
    "*/routes.py",
    "*/schemas.py",
    "*/tron_client.py",
    "*/order_repository.py",
    "*/team_repository.py",
    "*/user_repository.py",
]

[tool.coverage.report]
fail_under = 80
show_missing = true
